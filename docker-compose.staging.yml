services:
  app:
    restart: always
    environment:
      - NODE_ENV=staging
    volumes:
      - uploads_data:/app/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Templates dir (not conf.d): the nginx entrypoint substitutes ${DOMAIN}
      # in *.template files and writes the result to /etc/nginx/conf.d.
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      - app

volumes:
  uploads_data:
