services:
  # One-shot schema migrator (Prisma CLI). Completes before `app` starts.
  # Runtime app image stays lean — no prisma CLI / full node_modules.
  migrator:
    build:
      context: .
      target: migrator
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL_DOCKER:-postgresql://user:pass@db:5432/syority?schema=public}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL_DOCKER:-postgresql://user:pass@db:5432/syority?schema=public}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      # Public URL users open in the browser (must match host + port + scheme).
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-${NEXTAUTH_URL}}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      migrator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # M7.6F — Production Hardening
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # BullMQ background workers (schedule recalculation, report delivery,
  # knowledge engine). Runs from the builder stage, which has full
  # node_modules + tsx + the generated Prisma client. Without this service,
  # queued jobs never execute (E2E lineage audit P0-5).
  worker:
    build:
      context: .
      target: builder
    restart: unless-stopped
    command: ["npx", "tsx", "src/workers/index.ts"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL_DOCKER:-postgresql://user:pass@db:5432/syority?schema=public}
      - REDIS_URL=redis://redis:6379
    depends_on:
      migrator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=syority
    ports:
      # Bound to loopback only — never expose Postgres publicly on a VPS.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d syority"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Loopback only — required by BullMQ workers; not publicly reachable.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
